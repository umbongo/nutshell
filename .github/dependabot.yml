# Keep the SHA-pinned GitHub Actions current. Dependabot bumps the pin and
# rewrites the trailing "# vX.Y.Z" comment, so pinning costs no maintenance.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request for the whole weekly sweep, not one per action. Five
    # separate bumps used to open five pull requests that each queued a full
    # desktop integration run and cancelled each other out of the queue.
    open-pull-requests-limit: 1
    groups:
      actions:
        patterns: ["*"]
