name: CodeQL C/C++ Analysis

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: |
          # The hosted image bakes in third-party apt lists this build has no
          # use for, and Google Chrome's intermittently serves a Packages.gz
          # whose hash does not match its Release file. apt then exits 100 and
          # the whole analysis fails on a repository we never read from. Drop
          # those lists before updating rather than ignoring apt's exit code,
          # which would also hide a real failure to fetch libssl-dev.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          languages: c-cpp
          queries: security-extended

      - name: Build (native test target)
        run: make test
        env:
          # CodeQL traces the compiler invocations from make test,
          # which compiles all core/config/crypto/term source files
          # plus the test runner. UI files (Win32-only) are excluded
          # from the test build by design.
          CI: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca # v3.38.0
        with:
          category: "/language:c-cpp"
