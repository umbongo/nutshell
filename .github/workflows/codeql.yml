name: CodeQL C/C++ Analysis

on:
  # Both triggers are deliberate: the pull_request run reports alerts on the
  # diff, and the push run is what keeps the Security tab current and gives
  # code scanning the default-branch baseline that tells a new alert from a
  # pre-existing one. Both are hosted ubuntu runners -- free on a public repo,
  # and neither touches the self-hosted desktop.
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  # Pull requests: drop superseded runs -- pushing again to a branch should
  # not leave the previous hosted run burning to completion. Pushes to main:
  # never cancel. Each main commit is its own group (keyed on the sha), so
  # two merges in quick succession both get analysed; keyed on the ref, the
  # second merge used to cancel the first's run and leave a main commit with
  # no baseline (bc78b5c, the merge of #43, 2026-09-23).
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install dependencies
        run: |
          # The hosted image bakes in third-party apt repositories this build
          # has no use for, and Google Chrome's intermittently serves a
          # Packages.gz whose hash does not match its Release file. apt then
          # exits 100 and the whole analysis dies over a repository we never
          # read from. Drop them by the host they point at rather than by
          # filename (the image has moved these between .list and deb822
          # .sources files), and before updating rather than ignoring apt's
          # exit code, which would also hide a real failure to fetch libssl-dev.
          # No pipeline here: the job shell is bash -eo pipefail, so a grep
          # that matches nothing would exit 1 and fail the step.
          stale=$(grep -rlE 'dl[.]google[.]com|packages[.]microsoft[.]com' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null || true)
          if [ -n "$stale" ]; then sudo rm -vf $stale; fi
          sudo apt-get update
          sudo apt-get install -y libssl-dev libssh2-1-dev zlib1g-dev

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: c-cpp
          queries: security-extended

      - name: Build (native test target)
        run: make test
        env:
          # CodeQL traces the compiler invocations from make test,
          # which compiles all core/config/crypto/term source files
          # plus the test runner. UI files (Win32-only) are excluded
          # from the test build by design.
          CI: true

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:c-cpp"
