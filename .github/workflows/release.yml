name: Release

# Cuts a GitHub release from a v* tag by publishing the COMMITTED
# build/win/nutshell.exe -- nothing is built here.
#
#   git tag v1.2.3 && git push origin v1.2.3
#
# The merge gate (checks.yml / check-version.sh) has already verified that the
# exe on main was built from APP_VERSION, and the build is not reproducible
# (PE timestamps + UPX), so rebuilding on a release runner would only ship a
# different binary from the one that was checked. This job re-verifies that
# the tag, src/ui/resource.h and the exe's own version resource all say the
# same version, then publishes that exe. workflow_dispatch does the same
# verification and uploads the exe as a workflow artifact instead of
# publishing a release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify the tag, resource.h and the committed exe agree
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
        run: |
          set -u
          declared=$(sed -n 's/^[[:space:]]*#define[[:space:]]\+APP_VERSION[[:space:]]\+"\([0-9]\+\.[0-9]\+\.[0-9]\+\)".*/\1/p' src/ui/resource.h | head -n 1)
          [ -n "$declared" ] || { echo "No APP_VERSION in src/ui/resource.h" >&2; exit 1; }
          exe=$(bash .github/scripts/exe-version.sh build/win/nutshell.exe) || exit 1
          echo "ref=$REF_NAME  resource.h=$declared  exe=$exe"
          if [ "$exe" != "$declared" ]; then
            echo "Committed exe was built as $exe but src/ui/resource.h says $declared" >&2
            exit 1
          fi
          if [ "$EVENT" = "push" ]; then
            expected="${REF_NAME#v}"
            if [ "$declared" != "$expected" ]; then
              echo "Tag $REF_NAME does not match APP_VERSION $declared in src/ui/resource.h" >&2
              exit 1
            fi
          fi

      - name: Publish release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" build/win/nutshell.exe --title "${{ github.ref_name }}" --generate-notes

      - name: Upload exe (manual run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nutshell-exe
          path: build/win/nutshell.exe
          if-no-files-found: error
          retention-days: 14
