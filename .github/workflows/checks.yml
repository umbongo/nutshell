name: Checks

# Cheap, hosted-runner checks that do not need the MSYS2 toolchain or the
# test host. The "Version bump" job is a required status check on main.

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Drop superseded runs: pushing again to a branch should not leave the
  # previous hosted run burning to completion. Safe to cancel here -- unlike
  # the desktop harness, these jobs hold no machine state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Check APP_VERSION
        run: bash .github/scripts/check-version.sh "${{ github.event.pull_request.base.sha }}"
