name: Checks

# Hosted-runner checks that need neither the MSYS2 toolchain nor a desktop.
# The "Version bump" job is the one required status check on main -- despite
# the name it is the whole merge gate: version bumped, README current, and the
# committed exe built from that version (see .github/scripts/check-version.sh).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Drop superseded runs: pushing again to a branch should not leave the
  # previous hosted run burning to completion. Safe to cancel: these jobs
  # hold no machine state.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version-bump:
    name: Version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check version, README and the committed exe agree
        run: bash .github/scripts/check-version.sh "${{ github.event.pull_request.base.sha }}"
